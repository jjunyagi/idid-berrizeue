<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDID Berriz Translation Archive</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/Mvt9Qko.png" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/Mvt9Qko.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0b0c;
      --bg-card: #121214;
      --bg-subcard: #19191d;
      --bg-pill: #1f1f24;
      --bg-pill-active: #FF0080;
      --border-subtle: #25252b;
      --text-primary: #f5f5f7;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
      --badge-purple: #FF0080;
      --accent-soft: rgba(255, 0, 128, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
      padding-bottom: 60px;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 11, 12, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .site-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex: 0 0 auto;
      border-radius: 10px;
    }

    .site-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-title span.tag {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: #ff66b2;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 0, 128, 0.35);
    }

    @media (max-width: 560px) {
      .site-header {
        padding: 12px 14px;
      }

      .title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .site-title {
        flex-wrap: wrap;
      }

      #memberFilterSelect {
        max-width: 100%;
        width: 100%;
      }

      .controls-row {
        flex-direction: column;
      }

      .search-input {
        width: 100%;
      }
    }

    .controls-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--badge-purple);
    }

    .select-control {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    .feed {
      max-width: 680px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .berriz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px;
    }

    .card-type-label {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .artist-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .artist-header.compact .artist-avatar-wrap {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
    }

    .artist-header.compact .artist-name {
      font-size: 0.9rem;
    }

    .artist-avatar-wrap {
      width: 44px;
      height: 44px;
      position: relative;
      flex: 0 0 44px;
      border-radius: 50%;
      overflow: hidden;
      background: #26262b;
      border: 1px solid var(--border-subtle);
    }

    .artist-avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .artist-avatar-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #29232a;
      color: #ff80bd;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .artist-avatar-fallback[hidden],
    .artist-avatar[hidden] {
      display: none;
    }

    .artist-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .artist-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .artist-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .verified-badge {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .post-date {
      font-size: 0.8rem;
      color: #8e8e93;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    .content-block {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .text-en {
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: pre-line;
    }

    .text-kr {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.9rem;
      color: var(--text-secondary);
      white-space: pre-line;
      padding: 9px 12px;
      border-radius: 10px;
      background: var(--bg-subcard);
      border-left: 2px solid var(--badge-purple);
    }

    .text-kr[hidden] {
      display: none;
    }

    .original-toggle-btn {
      align-self: flex-start;
      background: transparent;
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.75rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .original-toggle-btn:hover,
    .original-toggle-btn[aria-expanded="true"] {
      color: #ff80bd;
      border-color: rgba(255, 0, 128, 0.45);
      background: var(--accent-soft);
    }

    .media-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .media-grid.two-img {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .media-grid.single-img {
      grid-template-columns: 1fr;
    }

    .media-grid img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      object-fit: cover;
      max-height: 440px;
      cursor: zoom-in;
      transition: opacity 0.15s ease;
    }

    .media-grid img:hover {
      opacity: 0.92;
    }

    .fan-context {
      background: var(--bg-subcard);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .fan-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .fan-context .text-en {
      font-size: 0.88rem;
      color: #d1d1d6;
    }

    .fan-context .text-kr {
      font-size: 0.85rem;
      color: #b8b8c0;
      background: var(--bg-card);
      border-left-color: #636366;
      margin-top: 6px;
    }

    .fan-context .media-grid {
      margin-top: 8px;
    }

    .fan-context .media-grid img {
      max-height: 260px;
    }

    /* Threaded Artist Comments & Replies */
    .post-thread {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .thread-heading {
      font-size: 0.74rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .thread-item {
      background: var(--bg-subcard);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .fan-comment-block .fan-author {
      font-size: 0.86rem;
      font-weight: 700;
      color: #f5f5f7;
    }

    .fan-comment-block .fan-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .artist-reply-nested {
      margin-top: 10px;
      padding-top: 10px;
      padding-left: 12px;
      border-top: 1px dashed var(--border-subtle);
      border-left: 2px solid var(--badge-purple);
    }

    .reply-badge {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #ff80bd;
      margin-bottom: 6px;
    }

    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .status-state {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 16px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="title-row">
        <div class="site-title">
          <img class="site-logo"
               src="https://i.imgur.com/Mvt9Qko.png"
               alt="IDID Berriz Archive logo"
               onerror="this.style.display='none'" />
          <span>IDID Berriz Archive</span>
          <span class="tag">TRANSLATIONS</span>
        </div>
        <select id="memberFilterSelect" class="select-control" title="Filter by member" aria-label="Filter by member">
          <option value="all">All Members</option>
          <option value="yonghoon">Jang Yonghoon</option>
          <option value="minjae">Kim Minjae</option>
          <option value="wonbin">Park Wonbin</option>
          <option value="yoochan">Chu Yoochan</option>
          <option value="seonghyeon">Park Seonghyeon</option>
          <option value="junhyuk">Baek Junhyuk</option>
          <option value="semin">Jeong Semin</option>
        </select>
      </div>

      <div class="controls-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search English translation, Korean text, or date..." />
        <select id="typeFilter" class="select-control">
          <option value="all">All Types</option>
          <option value="post">Posts</option>
          <option value="comment">Comments</option>
          <option value="reply">Replies</option>
        </select>
      </div>
    </div>
  </header>

  <main class="feed" id="feedContainer">
    <div class="status-state">Loading translations from Google Sheets...</div>
  </main>

  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="Full view" />
  </div>

  <script>
    const SHEET_ID = "1DPQ6k2ez6VuRTeipaPxEHuDBmd76B4dlKt21NTdbgDI";

    let MEMBERS = {
      yonghoon:   { en: "Jang Yonghoon",   kr: "장용훈", avatar: "" },
      minjae:     { en: "Kim Minjae",      kr: "김민재", avatar: "" },
      wonbin:     { en: "Park Wonbin",     kr: "박원빈", avatar: "" },
      yoochan:    { en: "Chu Yoochan",     kr: "추유찬", avatar: "" },
      seonghyeon: { en: "Park Seonghyeon", kr: "박성현", avatar: "" },
      junhyuk:    { en: "Baek Junhyuk",    kr: "백준혁", avatar: "" },
      semin:      { en: "Jeong Semin",     kr: "정세민", avatar: "" }
    };

    let ARCHIVE_DATA = [];
    let originalToggleCounter = 0;

    function normalizeAvatarUrl(rawUrl) {
      let url = String(rawUrl || "").trim();
      if (!url) return "";
      if (url.startsWith("//")) url = "https:" + url;

      let match = url.match(/drive\.google\.com\/file\/d\/([^/?]+)/i)
        || url.match(/[?&]id=([^&]+)/i);
      if (url.includes("drive.google.com") && match) {
        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }

      if (/^https?:\/\/(www\.)?imgur\.com\/[a-zA-Z0-9]+$/.test(url)) {
        const id = url.split("/").pop();
        return `https://i.imgur.com/${id}.png`;
      }
      return url;
    }

    function cleanCell(value) {
      return String(value ?? "").trim();
    }

    function normalizeId(val) {
      return cleanCell(val).replace(/\.0+$/, "").toLowerCase();
    }

    function firstValue(row, aliases) {
      for (const alias of aliases) {
        const value = cleanCell(row[alias]);
        if (value) return value;
      }
      return "";
    }

    function memberKeyFromValue(value) {
      const v = cleanCell(value).toLowerCase();
      if (MEMBERS[v]) return v;
      const normalized = v.replace(/[^a-z0-9\uac00-\ud7a3]/g, "");
      for (const [key, member] of Object.entries(MEMBERS)) {
        const candidates = [key, member.en, member.kr].map(x => cleanCell(x).toLowerCase().replace(/[^a-z0-9\uac00-\ud7a3]/g, ""));
        if (candidates.includes(normalized)) return key;
      }
      return "";
    }

    function getMemberInitials(member) {
      const name = (member?.en || member?.kr || "ID").trim();
      return name.split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase();
    }

    const VERIFIED_SVG = `
      <span class="verified-badge" title="Verified Artist">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
          <path d="M12 1.75L14.62 3.32L17.66 3.16L19.04 5.88L21.6 7.55L21.25 10.58L22.63 13.3L20.72 15.69L20.47 18.73L17.56 19.72L15.65 22.11L12.71 21.33L9.77 22.11L7.86 19.72L4.95 18.73L4.7 15.69L2.79 13.3L4.17 10.58L3.82 7.55L6.38 5.88L7.76 3.16L10.8 3.32L12 1.75Z" fill="#FF0080"/>
          <path d="M8.6 12.2L10.9 14.5L15.6 9.6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    `;

    const TRANSLATE_ICON_SVG = `
      <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m5 8 6 6" />
        <path d="m4 14 6-6 2-3" />
        <path d="M2 5h12" />
        <path d="M7 2h1" />
        <path d="m22 22-5-10-5 10" />
        <path d="M14 18h6" />
      </svg>
    `;

    function parseImageList(raw) {
      if (!raw) return [];
      return raw
        .split(/[\n,]+/)
        .map(u => normalizeAvatarUrl(u.trim()))
        .filter(Boolean);
    }

    async function fetchSheetTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tabName)}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`Google Sheets returned HTTP ${res.status} for tab "${tabName}".`);
      const responseText = await res.text();
      const jsonStart = responseText.indexOf("{");
      const jsonEnd = responseText.lastIndexOf("}");
      if (jsonStart < 0 || jsonEnd <= jsonStart) {
        throw new Error(`Could not read the Google Sheets response for tab "${tabName}".`);
      }
      const data = JSON.parse(responseText.slice(jsonStart, jsonEnd + 1));
      if (data.status === "error") {
        throw new Error(data.errors?.[0]?.detailed_message || `Google Sheets could not read tab "${tabName}".`);
      }

      const cols = (data.table?.cols || []).map((c, i) =>
        cleanCell(c.label || c.id || `column_${i + 1}`).toLowerCase().replace(/[\s-]+/g, "_")
      );
      const rows = data.table?.rows || [];
      return rows.map(r => {
        const obj = {};
        cols.forEach((colName, idx) => {
          const cell = r.c?.[idx];
          obj[colName] = cell ? cleanCell(cell.f != null ? cell.f : cell.v) : "";
        });
        return obj;
      });
    }

    async function loadFromGoogleSheets() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = `<div class="status-state">Loading translations and member profiles...</div>`;

      try {
        const archiveRows = await fetchSheetTab("Archive");
        let memberRows = [];
        try {
          memberRows = await fetchSheetTab("Members");
        } catch (memberError) {
          console.error("Members tab could not be loaded:", memberError);
        }

        memberRows.forEach(row => {
          const rawKey = firstValue(row, ["key", "member", "member_key", "id", "name", "artist"]);
          const key = memberKeyFromValue(rawKey);
          if (!key) return;

          const korean = firstValue(row, ["kr", "korean", "korean_name", "name_kr"]);
          const english = firstValue(row, ["en", "english", "english_name", "name_en"]);
          const avatar = firstValue(row, ["avatar", "photo", "picture", "image", "image_url", "avatar_url", "profile_picture", "profile_image", "photo_url"]);
          if (korean) MEMBERS[key].kr = korean;
          if (english) MEMBERS[key].en = english;
          if (avatar) MEMBERS[key].avatar = normalizeAvatarUrl(avatar);
        });

        const parsedRows = archiveRows
          .filter(r => r.member && (r.kr || r.en || r.images || r.fan_kr || r.fan_en || r.fan_images))
          .map(r => {
            const fanAuthor = firstValue(r, ["fan_author", "fan_name", "fan", "author", "op"]);
            const fanKr = firstValue(r, ["fan_kr", "fan_post_kr", "fan_post", "fan_text_kr", "fan_comment_kr", "op_kr"]);
            const fanEn = firstValue(r, ["fan_en", "fan_post_en", "fan_translation", "fan_text_en", "fan_comment_en", "op_en"]);
            const rawFanImages = firstValue(r, ["fan_images", "fan_image", "fan_post_images", "fan_post_image", "fan_img", "op_images"]);
            const fanImages = parseImageList(rawFanImages);
            const hasFanContext = Boolean(fanKr || fanEn || fanImages.length > 0);
            const parentId = normalizeId(firstValue(r, ["parent_id", "post_id", "parent", "reply_to_id", "thread_id"]));
            const rawType = cleanCell(r.type).toLowerCase();

            let normalizedType = "post";
            if (rawType.includes("reply")) normalizedType = "reply";
            else if (rawType.includes("comment")) normalizedType = "comment";
            else if (rawType.includes("post") || !rawType) normalizedType = "post";

            return {
              id: normalizeId(firstValue(r, ["id", "post_no", "no"])),
              parentId,
              type: normalizedType,
              member: memberKeyFromValue(r.member) || r.member.trim().toLowerCase(),
              date: (r.date || "").trim(),
              kr: r.kr || "",
              en: r.en || "",
              images: parseImageList(r.images),
              fanContext: hasFanContext ? {
                author: fanAuthor || "WITHID",
                kr: fanKr,
                en: fanEn,
                images: fanImages
              } : null,
              threadItems: [],
              nestedReplies: []
            };
          });

        const itemsById = new Map();
        parsedRows.forEach(item => {
          if (item.id) {
            itemsById.set(item.id, item);
          }
        });

        const topLevelItems = [];
        parsedRows.forEach(item => {
          if (!item.parentId || !itemsById.has(item.parentId)) {
            topLevelItems.push(item);
            return;
          }

          const parent = itemsById.get(item.parentId);
          // If parent is a comment/reply (or a row with fanContext), attach as a reply under that comment
          if (parent.type === "comment" || parent.type === "reply" || parent.fanContext) {
            parent.nestedReplies.push(item);
          } else {
            parent.threadItems.push(item);
          }
        });

        ARCHIVE_DATA = topLevelItems.reverse();
        renderFeed();
      } catch (err) {
        console.error("Archive loading error:", err);
        container.innerHTML = `
          <div class="status-state">
            <b>Could not load the Google Sheet.</b><br><br>
            ${escapeHtml(err.message)}<br><br>
            Check that the sheet is shared as <b>Anyone with the link – Viewer</b> and that the tab is named exactly <b>Archive</b>.
          </div>`;
      }
    }

    let activeMember = "all";
    let activeType = "all";
    let searchQuery = "";

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatArtistName(memberKey) {
      const m = MEMBERS[memberKey];
      if (!m) return memberKey;
      return m.en || m.kr || memberKey;
    }

    function renderArtistHeader(memberKey, date, compact = false) {
      const m = MEMBERS[memberKey] || { kr: memberKey, en: memberKey, avatar: "" };
      const avatarUrl = normalizeAvatarUrl(m.avatar);
      const initials = getMemberInitials(m);
      return `
        <div class="artist-header ${compact ? "compact" : ""}">
          <div class="artist-avatar-wrap">
            <img class="artist-avatar"
                 src="${escapeHtml(avatarUrl)}"
                 alt="${escapeHtml(m.en || m.kr || memberKey)}"
                 loading="lazy"
                 ${avatarUrl ? "" : "hidden"}
                 onerror="this.hidden=true; this.nextElementSibling.hidden=false;" />
            <span class="artist-avatar-fallback" ${avatarUrl ? "hidden" : ""}>${escapeHtml(initials)}</span>
          </div>
          <div class="artist-meta">
            <div class="artist-name-row">
              <span class="artist-name">${escapeHtml(formatArtistName(memberKey))}</span>
              ${VERIFIED_SVG}
            </div>
            <div class="post-date">${escapeHtml(date)}</div>
          </div>
        </div>
      `;
    }

    function renderTextWithOriginal(kr, en) {
      const primaryDisplay = en || kr;
      const hasKoreanOriginal = Boolean(kr && kr.trim());
      if (!primaryDisplay && !hasKoreanOriginal) return "";

      const panelId = `orig-kr-${++originalToggleCounter}`;
      let html = `<div class="content-block">`;
      if (primaryDisplay) {
        html += `<div class="text-en">${escapeHtml(primaryDisplay)}</div>`;
      }
      if (hasKoreanOriginal) {
        html += `
          <button type="button"
                  class="original-toggle-btn"
                  aria-expanded="false"
                  aria-controls="${panelId}"
                  data-toggle-orig="${panelId}">
            ${TRANSLATE_ICON_SVG}
            <span>Show original text</span>
          </button>
          <div class="text-kr" id="${panelId}" hidden>${escapeHtml(kr)}</div>
        `;
      }
      html += `</div>`;
      return html;
    }

    function renderImages(imageList, altLabel) {
      if (!imageList || imageList.length === 0) return "";
      const layoutClass =
        imageList.length === 1 ? "single-img" :
        imageList.length === 2 ? "two-img" : "";
      return `
        <div class="media-grid ${layoutClass}">
          ${imageList.map(src => `<img src="${escapeHtml(src)}" alt="${escapeHtml(altLabel)}" loading="lazy" data-zoom="${escapeHtml(src)}" />`).join("")}
        </div>
      `;
    }

    function renderNestedArtistReply(replyObj) {
      return `
        <div class="artist-reply-nested">
          <span class="reply-badge">Artist Reply</span>
          ${renderArtistHeader(replyObj.member, replyObj.date, true)}
          ${renderTextWithOriginal(replyObj.kr, replyObj.en)}
          ${renderImages(replyObj.images, "Artist reply attachment")}
        </div>
      `;
    }

    function renderThreadItem(child) {
      const fan = child.fanContext;
      const fanPrimary = fan ? (fan.en || fan.kr) : "";
      const fanHasKr = Boolean(fan && fan.kr && fan.kr.trim());
      const fanPanelId = `orig-kr-${++originalToggleCounter}`;
      const hasArtistContent = Boolean(child.kr || child.en || (child.images && child.images.length > 0));
      const repliesHtml = (child.nestedReplies || []).map(renderNestedArtistReply).join("");

      return `
        <div class="thread-item">
          ${fan ? `
            <div class="fan-comment-block">
              <div>
                <span class="fan-author">${escapeHtml(fan.author)}</span>
                ${child.date ? `<span class="fan-date">${escapeHtml(child.date)}</span>` : ""}
              </div>
              ${fanPrimary ? `<div class="text-en" style="margin-top:6px;">${escapeHtml(fanPrimary)}</div>` : ""}
              ${fanHasKr ? `
                <button type="button"
                        class="original-toggle-btn"
                        style="margin-top:8px;"
                        aria-expanded="false"
                        aria-controls="${fanPanelId}"
                        data-toggle-orig="${fanPanelId}">
                  ${TRANSLATE_ICON_SVG}
                  <span>Show original text</span>
                </button>
                <div class="text-kr" id="${fanPanelId}" hidden>${escapeHtml(fan.kr)}</div>
              ` : ""}
              ${renderImages(fan.images, "Fan comment attachment")}
            </div>
          ` : ""}

          ${hasArtistContent ? `
            <div class="${fan ? "artist-reply-nested" : ""}">
              <span class="reply-badge">${child.type === "comment" ? "Artist Comment" : "Artist Reply"}</span>
              ${renderArtistHeader(child.member, child.date, true)}
              ${renderTextWithOriginal(child.kr, child.en)}
              ${renderImages(child.images, "Artist attachment")}
            </div>
          ` : ""}

          ${repliesHtml}
        </div>
      `;
    }

    function itemInvolvesMember(item, member) {
      if (member === "all") return true;
      if (item.member === member) return true;
      if (item.threadItems?.some(c => itemInvolvesMember(c, member))) return true;
      if (item.nestedReplies?.some(r => itemInvolvesMember(r, member))) return true;
      return false;
    }

    function collectSearchableStrings(item) {
      const memberInfo = MEMBERS[item.member];
      const base = [
        item.kr,
        item.en,
        item.date,
        memberInfo?.kr,
        memberInfo?.en,
        item.fanContext?.author,
        item.fanContext?.kr,
        item.fanContext?.en
      ];
      const fromThread = (item.threadItems || []).flatMap(collectSearchableStrings);
      const fromReplies = (item.nestedReplies || []).flatMap(collectSearchableStrings);
      return [...base, ...fromThread, ...fromReplies].filter(Boolean);
    }

    function renderFeed() {
      originalToggleCounter = 0;
      const container = document.getElementById("feedContainer");
      const q = searchQuery.trim().toLowerCase();

      const filtered = ARCHIVE_DATA.filter(item => {
        const matchesMember = itemInvolvesMember(item, activeMember);
        const matchesType = activeType === "all" || item.type === activeType;

        if (!matchesMember || !matchesType) return false;
        if (!q) return true;

        return collectSearchableStrings(item).join(" ").toLowerCase().includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status-state">No matching posts, comments, or replies found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const typeLabel =
          item.type === "post" ? "Artist Post" :
          item.type === "comment" ? "Artist Comment" : "Artist Reply";

        let fanQuoteHtml = "";
        if (!item.threadItems?.length && item.fanContext) {
          const fanPrimary = item.fanContext.en || item.fanContext.kr;
          const fanHasKr = Boolean(item.fanContext.kr && item.fanContext.kr.trim());
          const fanPanelId = `orig-kr-${++originalToggleCounter}`;
          const contextHeader = item.type === "comment"
            ? `${escapeHtml(item.fanContext.author)}'s Post`
            : `Replying to ${escapeHtml(item.fanContext.author)}`;

          fanQuoteHtml = `
            <div class="fan-context">
              <div class="fan-label">${contextHeader}</div>
              ${fanPrimary ? `<div class="text-en">${escapeHtml(fanPrimary)}</div>` : ""}
              ${fanHasKr ? `
                <button type="button"
                        class="original-toggle-btn"
                        style="margin-top:8px;"
                        aria-expanded="false"
                        aria-controls="${fanPanelId}"
                        data-toggle-orig="${fanPanelId}">
                  ${TRANSLATE_ICON_SVG}
                  <span>Show original text</span>
                </button>
                <div class="text-kr" id="${fanPanelId}" hidden>${escapeHtml(item.fanContext.kr)}</div>
              ` : ""}
              ${renderImages(item.fanContext.images, "Fan attachment")}
            </div>
          `;
        }

        const nestedRepliesOnMainHtml = (item.nestedReplies || []).map(renderNestedArtistReply).join("");

        let threadHtml = "";
        if (item.threadItems && item.threadItems.length > 0) {
          threadHtml = `
            <div class="post-thread">
              <div class="thread-heading">Comments &amp; Artist Replies (${item.threadItems.length})</div>
              ${item.threadItems.map(renderThreadItem).join("")}
            </div>
          `;
        }

        return `
          <article class="berriz-card">
            <span class="card-type-label">${typeLabel}</span>
            ${fanQuoteHtml}
            ${renderArtistHeader(item.member, item.date)}
            ${renderTextWithOriginal(item.kr, item.en)}
            ${renderImages(item.images, "Artist attachment")}
            ${nestedRepliesOnMainHtml}
            ${threadHtml}
          </article>
        `;
      }).join("");
    }

    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    document.getElementById("feedContainer").addEventListener("click", (e) => {
      const toggleBtn = e.target.closest("[data-toggle-orig]");
      if (toggleBtn) {
        const targetId = toggleBtn.getAttribute("data-toggle-orig");
        const krPanel = document.getElementById(targetId);
        if (krPanel) {
          const isOpen = !krPanel.hidden;
          krPanel.hidden = isOpen;
          toggleBtn.setAttribute("aria-expanded", String(!isOpen));
          const labelSpan = toggleBtn.querySelector("span");
          if (labelSpan) {
            labelSpan.textContent = isOpen ? "Show original text" : "Hide original text";
          }
        }
        return;
      }

      const zoomSrc = e.target.getAttribute("data-zoom");
      if (!zoomSrc) return;
      lightboxImg.src = zoomSrc;
      lightbox.classList.add("open");
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    });

    document.getElementById("memberFilterSelect").addEventListener("change", (e) => {
      activeMember = e.target.value;
      renderFeed();
    });

    document.getElementById("typeFilter").addEventListener("change", (e) => {
      activeType = e.target.value;
      renderFeed();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderFeed();
    });

    loadFromGoogleSheets();
  </script>
</body>
</html>
