<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IDID Berriz Translation Archive</title>
  <link rel="icon" type="image/png" href="https://i.imgur.com/Mvt9Qko.png" />
  <link rel="apple-touch-icon" href="https://i.imgur.com/Mvt9Qko.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-page: #0b0b0c;
      --bg-card: #121214;
      --bg-subcard: #19191d;
      --bg-pill: #1f1f24;
      --bg-pill-active: #FF0080;
      --border-subtle: #25252b;
      --text-primary: #f5f5f7;
      --text-secondary: #d1d1d6;
      --text-muted: #8e8e93;
      --badge-purple: #FF0080;
      --accent-soft: rgba(255, 0, 128, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-primary);
      font-family: 'Inter', 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      line-height: 1.55;
      padding-bottom: 60px;
    }

    /* Top Header */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11, 11, 12, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      padding: 16px 20px;
    }

    .header-inner {
      max-width: 680px;
      margin: 0 auto;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .site-logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
      flex: 0 0 auto;
      border-radius: 10px;
    }

    .site-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-title span.tag {
      font-size: 0.72rem;
      font-weight: 600;
      background: var(--accent-soft);
      color: #ff66b2;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 0, 128, 0.35);
    }

    @media (max-width: 560px) {
      .site-header {
        padding: 12px 14px;
      }

      .title-row {
        align-items: flex-start;
        flex-direction: column;
      }

      .site-title {
        flex-wrap: wrap;
      }

      #memberFilterSelect {
        max-width: 100%;
        width: 100%;
      }

      .controls-row {
        flex-direction: column;
      }

      .search-input {
        width: 100%;
      }
    }

    /* Controls */
    .controls-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1;
      min-width: 180px;
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--badge-purple);
    }

    .select-control {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 0.84rem;
      cursor: pointer;
    }

    /* Member Filter Pills */
    .member-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .member-filters::-webkit-scrollbar {
      display: none;
    }

    .filter-pill {
      background: var(--bg-pill);
      color: var(--text-secondary);
      border: 1px solid var(--border-subtle);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 0.8rem;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-pill:hover {
      border-color: #444;
    }

    .filter-pill.active {
      background: var(--bg-pill-active);
      color: #fff;
      border-color: var(--bg-pill-active);
      font-weight: 600;
    }

    /* Feed Container */
    .feed {
      max-width: 680px;
      margin: 20px auto 0;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card Style */
    .berriz-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 18px;
    }

    .card-type-label {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    /* BERRIZ ARTIST HEADER */
    .artist-header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .artist-avatar-wrap {
      width: 44px;
      height: 44px;
      position: relative;
      flex: 0 0 44px;
      border-radius: 50%;
      overflow: hidden;
      background: #26262b;
      border: 1px solid var(--border-subtle);
    }

    .artist-avatar {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .artist-avatar-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #29232a;
      color: #ff80bd;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .artist-avatar-fallback[hidden],
    .artist-avatar[hidden] {
      display: none;
    }

    .artist-meta {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .artist-name-row {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .artist-name {
      font-size: 0.98rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .verified-badge {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .post-date {
      font-size: 0.8rem;
      color: #8e8e93;
      margin-top: 1px;
      font-variant-numeric: tabular-nums;
    }

    /* Post / Comment Content */
    .content-block {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .text-kr {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 0.95rem;
      color: var(--text-primary);
      white-space: pre-line;
    }

    .text-en {
      font-size: 0.94rem;
      color: var(--text-secondary);
      white-space: pre-line;
      padding-left: 11px;
      border-left: 2px solid var(--badge-purple);
    }

    /* Media Grids (Artist & Fan) */
    .media-grid {
      margin-top: 12px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px;
    }

    .media-grid.single-img {
      grid-template-columns: 1fr;
    }

    .media-grid img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      object-fit: cover;
      max-height: 440px;
      cursor: zoom-in;
      transition: opacity 0.15s ease;
    }

    .media-grid img:hover {
      opacity: 0.92;
    }

    /* Fan Context Box (for Replies) */
    .fan-context {
      background: var(--bg-subcard);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }

    .fan-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .fan-context .text-kr {
      font-size: 0.88rem;
      color: #c7c7cc;
    }

    .fan-context .text-en {
      font-size: 0.86rem;
      color: #9e9ea6;
      border-left-color: #48484f;
      margin-top: 6px;
    }

    .fan-context .media-grid {
      margin-top: 8px;
    }

    .fan-context .media-grid img {
      max-height: 260px;
    }

    /* Lightbox Modal */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      cursor: zoom-out;
    }

    .lightbox.open {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    .status-state {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 16px;
      font-size: 0.92rem;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="title-row">
        <div class="site-title">
          <img class="site-logo"
               src="https://i.imgur.com/Mvt9Qko.png"
               alt="IDID Berriz Archive logo"
               onerror="this.style.display='none'" />
          <span>IDID Berriz Archive</span>
          <span class="tag">TRANSLATIONS</span>
        </div>
        <select id="memberFilterSelect" class="select-control" title="Filter by member" aria-label="Filter by member">
          <option value="all">All Members</option>
          <option value="yonghoon">Jang Yonghoon</option>
          <option value="minjae">Kim Minjae</option>
          <option value="wonbin">Park Wonbin</option>
          <option value="yoochan">Chu Yoochan</option>
          <option value="seonghyeon">Park Seonghyeon</option>
          <option value="junhyuk">Baek Junhyuk</option>
          <option value="semin">Jeong Semin</option>
        </select>
      </div>

      <div class="controls-row">
        <input type="text" id="searchInput" class="search-input" placeholder="Search Korean, English translation, or date..." />
        <select id="typeFilter" class="select-control">
          <option value="all">All Types</option>
          <option value="post">Posts</option>
          <option value="comment">Comments</option>
          <option value="reply">Replies</option>
        </select>
        <select id="langFilter" class="select-control">
          <option value="both">KR + EN</option>
          <option value="en">English Only</option>
          <option value="kr">Korean Only</option>
        </select>
      </div>

    </div>
  </header>

  <main class="feed" id="feedContainer">
    <div class="status-state">Loading translations from Google Sheets...</div>
  </main>

  <!-- Full-screen image preview -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="Full view" />
  </div>

  <script>
    // ==========================================
    // 1. PASTE YOUR GOOGLE SHEET ID HERE
    // ==========================================
    const SHEET_ID = "1DPQ6k2ez6VuRTeipaPxEHuDBmd76B4dlKt21NTdbgDI";

    let MEMBERS = {
      yonghoon:   { en: "Jang Yonghoon",   kr: "장용훈", avatar: "" },
      minjae:     { en: "Kim Minjae",      kr: "김민재", avatar: "" },
      wonbin:     { en: "Park Wonbin",     kr: "박원빈", avatar: "" },
      yoochan:    { en: "Chu Yoochan",     kr: "추유찬", avatar: "" },
      seonghyeon: { en: "Park Seonghyeon", kr: "박성현", avatar: "" },
      junhyuk:    { en: "Baek Junhyuk",    kr: "백준혁", avatar: "" },
      semin:      { en: "Jeong Semin",     kr: "정세민", avatar: "" }
    };

    let ARCHIVE_DATA = [];

    // Clean and normalize URLs from the Members sheet.
    function normalizeAvatarUrl(rawUrl) {
      let url = String(rawUrl || "").trim();
      if (!url) return "";
      if (url.startsWith("//")) url = "https:" + url;

      // Google Drive sharing URLs need the file ID converted to a display URL.
      let match = url.match(/drive\.google\.com\/file\/d\/([^/?]+)/i)
        || url.match(/[?&]id=([^&]+)/i);
      if (url.includes("drive.google.com") && match) {
        return `https://drive.google.com/uc?export=view&id=${match[1]}`;
      }

      // Imgur page links are not image files; convert common album/image pages.
      if (/^https?:\/\/(www\.)?imgur\.com\/[a-zA-Z0-9]+$/.test(url)) {
        const id = url.split("/").pop();
        return `https://i.imgur.com/${id}.png`;
      }
      return url;
    }

    function cleanCell(value) {
      return String(value ?? "").trim();
    }

    function firstValue(row, aliases) {
      for (const alias of aliases) {
        const value = cleanCell(row[alias]);
        if (value) return value;
      }
      return "";
    }

    function memberKeyFromValue(value) {
      const v = cleanCell(value).toLowerCase();
      if (MEMBERS[v]) return v;
      const normalized = v.replace(/[^a-z0-9\uac00-\ud7a3]/g, "");
      for (const [key, member] of Object.entries(MEMBERS)) {
        const candidates = [key, member.en, member.kr].map(x => cleanCell(x).toLowerCase().replace(/[^a-z0-9\uac00-\ud7a3]/g, ""));
        if (candidates.includes(normalized)) return key;
      }
      return "";
    }

    function getMemberInitials(member) {
      const name = (member?.en || member?.kr || "ID").trim();
      return name.split(/\s+/).slice(0, 2).map(part => part[0] || "").join("").toUpperCase();
    }

    const VERIFIED_SVG = `
      <span class="verified-badge" title="Verified Artist">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none">
          <path d="M12 1.75L14.62 3.32L17.66 3.16L19.04 5.88L21.6 7.55L21.25 10.58L22.63 13.3L20.72 15.69L20.47 18.73L17.56 19.72L15.65 22.11L12.71 21.33L9.77 22.11L7.86 19.72L4.95 18.73L4.7 15.69L2.79 13.3L4.17 10.58L3.82 7.55L6.38 5.88L7.76 3.16L10.8 3.32L12 1.75Z" fill="#FF0080"/>
          <path d="M8.6 12.2L10.9 14.5L15.6 9.6" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    `;

    function parseImageList(raw) {
      if (!raw) return [];
      return raw
        .split(/[\n,]+/)
        .map(u => u.trim())
        .filter(Boolean);
    }

    async function fetchSheetTab(tabName) {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(tabName)}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`Google Sheets returned HTTP ${res.status} for tab "${tabName}".`);
      const responseText = await res.text();
      const jsonStart = responseText.indexOf("{");
      const jsonEnd = responseText.lastIndexOf("}");
      if (jsonStart < 0 || jsonEnd <= jsonStart) {
        throw new Error(`Could not read the Google Sheets response for tab "${tabName}". Check that the sheet is shared and the tab name is correct.`);
      }
      const data = JSON.parse(responseText.slice(jsonStart, jsonEnd + 1));
      if (data.status === "error") {
        throw new Error(data.errors?.[0]?.detailed_message || `Google Sheets could not read tab "${tabName}".`);
      }

      const cols = (data.table?.cols || []).map((c, i) =>
        cleanCell(c.label || c.id || `column_${i + 1}`).toLowerCase().replace(/[\s-]+/g, "_")
      );
      const rows = data.table?.rows || [];
      return rows.map(r => {
        const obj = {};
        cols.forEach((colName, idx) => {
          const cell = r.c?.[idx];
          obj[colName] = cell ? cleanCell(cell.f != null ? cell.f : cell.v) : "";
        });
        return obj;
      });
    }

    async function loadFromGoogleSheets() {
      const container = document.getElementById("feedContainer");
      container.innerHTML = `<div class="status-state">Loading translations and member profiles...</div>`;

      if (!SHEET_ID || SHEET_ID === "PASTE_YOUR_GOOGLE_SHEET_ID_HERE") {
        container.innerHTML = `<div class="status-state">Please set your <b>SHEET_ID</b> in the script.</div>`;
        return;
      }

      try {
        // Archive is essential. Members is optional because default member names are built in.
        const archiveRows = await fetchSheetTab("Archive");
        let memberRows = [];
        let memberSheetWarning = "";
        try {
          memberRows = await fetchSheetTab("Members");
        } catch (memberError) {
          console.error("Members tab could not be loaded:", memberError);
          memberSheetWarning = `Member profile sheet could not be loaded: ${escapeHtml(memberError.message)}. Showing initials until this is fixed.`;
        }

        let matchedMemberRows = 0;
        memberRows.forEach(row => {
          const rawKey = firstValue(row, ["key", "member", "member_key", "id", "name", "artist"]);
          const key = memberKeyFromValue(rawKey);
          if (!key) return;

          const korean = firstValue(row, ["kr", "korean", "korean_name", "name_kr"]);
          const english = firstValue(row, ["en", "english", "english_name", "name_en"]);
          const avatar = firstValue(row, ["avatar", "photo", "picture", "image", "image_url", "avatar_url", "profile_picture", "profile_image", "photo_url"]);
          if (korean) MEMBERS[key].kr = korean;
          if (english) MEMBERS[key].en = english;
          if (avatar) MEMBERS[key].avatar = normalizeAvatarUrl(avatar);
          matchedMemberRows++;
        });

        ARCHIVE_DATA = archiveRows
          .filter(r => r.member && (r.kr || r.en || r.images))
          .map(r => {
            const fanImages = parseImageList(r.fan_images);
            const hasFanContext = r.fan_kr || r.fan_en || fanImages.length > 0;
            return {
              id: r.id || "",
              type: (r.type || "post").trim().toLowerCase(),
              member: memberKeyFromValue(r.member) || r.member.trim().toLowerCase(),
              date: (r.date || "").trim(),
              kr: r.kr || "",
              en: r.en || "",
              images: parseImageList(r.images),
              fanContext: hasFanContext ? {
                author: (r.fan_author || "WITHID").trim(),
                kr: r.fan_kr || "",
                en: r.fan_en || "",
                images: fanImages
              } : null
            };
          })
          .reverse();

        renderFeed();

        if (memberSheetWarning) {
          container.insertAdjacentHTML("afterbegin", `<div class="status-state" style="padding:12px 16px;color:#ff80bd;font-size:.82rem">${memberSheetWarning}</div>`);
        } else if (memberRows.length && !matchedMemberRows) {
          container.insertAdjacentHTML("afterbegin", `<div class="status-state" style="padding:12px 16px;color:#ff80bd;font-size:.82rem">Members tab loaded, but none of its rows matched the seven member keys. Check the first column (key/member/name) and its values.</div>`);
        }
      } catch (err) {
        console.error("Archive loading error:", err);
        container.innerHTML = `
          <div class="status-state">
            <b>Could not load the Google Sheet.</b><br><br>
            ${escapeHtml(err.message)}<br><br>
            Check that the sheet is shared as <b>Anyone with the link – Viewer</b> and that the tab is named exactly <b>Archive</b>.
          </div>`;
      }
    }

    let activeMember = "all";
    let activeType = "all";
    let langMode = "both";
    let nameMode = "kr";
    let searchQuery = "";

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatArtistName(memberKey) {
      const m = MEMBERS[memberKey];
      if (!m) return memberKey;
      if (nameMode === "kr") return m.kr;
      if (nameMode === "en") return m.en;
      return `${m.kr} · ${m.en}`;
    }

    function renderArtistHeader(memberKey, date) {
      const m = MEMBERS[memberKey] || { kr: memberKey, en: memberKey, avatar: "" };
      const avatarUrl = normalizeAvatarUrl(m.avatar);
      const initials = getMemberInitials(m);
      return `
        <div class="artist-header">
          <div class="artist-avatar-wrap">
            <img class="artist-avatar"
                 src="${escapeHtml(avatarUrl)}"
                 alt="${escapeHtml(m.en || m.kr || memberKey)}"
                 loading="lazy"
                 ${avatarUrl ? "" : "hidden"}
                 onerror="this.hidden=true; this.nextElementSibling.hidden=false; this.nextElementSibling.title='Avatar failed to load. Check that the image URL is public and direct.'" />
            <span class="artist-avatar-fallback" ${avatarUrl ? "hidden" : ""}>${escapeHtml(initials)}</span>
          </div>
          <div class="artist-meta">
            <div class="artist-name-row">
              <span class="artist-name">${escapeHtml(formatArtistName(memberKey))}</span>
              ${VERIFIED_SVG}
            </div>
            <div class="post-date">${escapeHtml(date)}</div>
          </div>
        </div>
      `;
    }

    function renderText(kr, en) {
      const showKr = (langMode === "both" || langMode === "kr") && kr;
      const showEn = (langMode === "both" || langMode === "en") && en;
      if (!showKr && !showEn) return "";

      let html = `<div class="content-block">`;
      if (showKr) html += `<div class="text-kr">${escapeHtml(kr)}</div>`;
      if (showEn) html += `<div class="text-en">${escapeHtml(en)}</div>`;
      html += `</div>`;
      return html;
    }

    function renderImages(imageList, altLabel) {
      if (!imageList || imageList.length === 0) return "";
      const singleClass = imageList.length === 1 ? "single-img" : "";
      return `
        <div class="media-grid ${singleClass}">
          ${imageList.map(src => `<img src="${escapeHtml(src)}" alt="${escapeHtml(altLabel)}" loading="lazy" data-zoom="${escapeHtml(src)}" />`).join("")}
        </div>
      `;
    }

    function renderFeed() {
      const container = document.getElementById("feedContainer");
      const q = searchQuery.trim().toLowerCase();

      const filtered = ARCHIVE_DATA.filter(item => {
        const matchesMember = activeMember === "all" || item.member === activeMember;
        const matchesType = activeType === "all" || item.type === activeType;

        if (!matchesMember || !matchesType) return false;
        if (!q) return true;

        const memberInfo = MEMBERS[item.member];
        const searchable = [
          item.kr,
          item.en,
          item.date,
          memberInfo?.kr,
          memberInfo?.en,
          item.fanContext?.kr,
          item.fanContext?.en
        ].filter(Boolean).join(" ").toLowerCase();

        return searchable.includes(q);
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="status-state">No matching posts, comments, or replies found.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const typeLabel =
          item.type === "post" ? "Artist Post" :
          item.type === "comment" ? "Artist Comment" : "Artist Reply";

        let fanQuoteHtml = "";
        if (item.type === "reply" && item.fanContext) {
          const showFanKr = (langMode === "both" || langMode === "kr") && item.fanContext.kr;
          const showFanEn = (langMode === "both" || langMode === "en") && item.fanContext.en;

          fanQuoteHtml = `
            <div class="fan-context">
              <div class="fan-label">Replying to ${escapeHtml(item.fanContext.author)}</div>
              ${showFanKr ? `<div class="text-kr">${escapeHtml(item.fanContext.kr)}</div>` : ""}
              ${showFanEn ? `<div class="text-en">${escapeHtml(item.fanContext.en)}</div>` : ""}
              ${renderImages(item.fanContext.images, "Fan attachment")}
            </div>
          `;
        }

        return `
          <article class="berriz-card">
            <span class="card-type-label">${typeLabel}</span>
            ${fanQuoteHtml}
            ${renderArtistHeader(item.member, item.date)}
            ${renderText(item.kr, item.en)}
            ${renderImages(item.images, "Artist attachment")}
          </article>
        `;
      }).join("");
    }

    // Lightbox click handler
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightboxImg");

    document.getElementById("feedContainer").addEventListener("click", (e) => {
      const zoomSrc = e.target.getAttribute("data-zoom");
      if (!zoomSrc) return;
      lightboxImg.src = zoomSrc;
      lightbox.classList.add("open");
    });

    lightbox.addEventListener("click", () => {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    });

    // Filter & Display Listeners
    document.getElementById("memberFilterSelect").addEventListener("change", (e) => {
      activeMember = e.target.value;
      renderFeed();
    });

    document.getElementById("typeFilter").addEventListener("change", (e) => {
      activeType = e.target.value;
      renderFeed();
    });

    document.getElementById("langFilter").addEventListener("change", (e) => {
      langMode = e.target.value;
      renderFeed();
    });


    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderFeed();
    });

    loadFromGoogleSheets();
  </script>
</body>
</html>
